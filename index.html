<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.O.R.E System</title>
<style>
  :root{
    --bg:#14171c;
    --panel:#1b2028;
    --card:#232a34;
    --line:#2e3641;
    --ink:#eef1f5;
    --sub:#8b95a3;
    --capture:#7c8794;
    --organize:#e8a33d;
    --review:#4fb3c9;
    --engage:#5fbf7a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  .core-app{
    max-width:1100px;
    margin:0 auto;
    padding:24px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .core-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .core-title{
    font-family:Georgia,'Times New Roman',serif;
    font-size:26px;
    letter-spacing:0.5px;
    margin:0;
  }
  .core-title span{color:var(--organize);}
  .core-sub{
    color:var(--sub);
    font-size:12.5px;
    font-family:'Courier New',monospace;
    letter-spacing:0.5px;
  }
  .core-sync{
    text-align:right;
    font-size:11px;
    color:var(--sub);
    font-family:'Courier New',monospace;
  }
  .core-sync-row{
    display:flex;
    gap:6px;
    align-items:center;
    justify-content:flex-end;
    margin-top:4px;
    flex-wrap:wrap;
  }
  .core-sync button, .core-sync-alt button{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    font-size:11px;
    padding:5px 9px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Courier New',monospace;
  }
  .core-sync button:hover, .core-sync-alt button:hover{border-color:#3a4351;}
  .core-add{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
  }
  .core-add input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink);
    font-size:14.5px;
    padding:6px 8px;
    min-width:0;
  }
  .core-add input::placeholder{color:var(--sub);}
  .core-add button{
    background:var(--organize);
    color:#1b1400;
    border:none;
    border-radius:7px;
    padding:8px 16px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .core-add button:hover{filter:brightness(1.08);}
  .core-board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    flex:1;
  }
  .core-col{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-width:0;
  }
  .core-col-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:2px 4px 8px 4px;
    border-bottom:1px solid var(--line);
  }
  .core-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .core-col-title{font-size:13.5px;font-weight:700;letter-spacing:0.3px;}
  .core-col-desc{font-size:11px;color:var(--sub);margin-left:auto;text-align:right;}
  .core-cards{
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow-y:auto;
    max-height:60vh;
    padding-right:2px;
  }
  .core-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--capture);
    border-radius:8px;
    padding:10px 10px 8px 10px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
    position:relative;
  }
  .core-card:hover{transform:translateY(-1px);border-color:#3a4351;}
  .core-card-text{font-size:13.5px;line-height:1.4;word-break:break-word;padding-right:16px;}
  .core-card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .core-card-time{font-size:10px;color:var(--sub);font-family:'Courier New',monospace;}
  .core-card-hint{font-size:10px;color:var(--sub);}
  .core-del{
    position:absolute;
    top:8px;right:8px;
    color:var(--sub);
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    padding:2px 4px;
  }
  .core-del:hover{color:#e0616a;}
  .core-empty{
    color:var(--sub);
    font-size:12px;
    text-align:center;
    padding:24px 6px;
    border:1px dashed var(--line);
    border-radius:8px;
  }
  .core-col[data-stage="capture"] .core-dot{background:var(--capture);}
  .core-col[data-stage="organize"] .core-dot{background:var(--organize);}
  .core-col[data-stage="review"] .core-dot{background:var(--review);}
  .core-col[data-stage="engage"] .core-dot{background:var(--engage);}
  .core-card[data-stage="capture"]{border-left-color:var(--capture);}
  .core-card[data-stage="organize"]{border-left-color:var(--organize);}
  .core-card[data-stage="review"]{border-left-color:var(--review);}
  .core-card[data-stage="engage"]{border-left-color:var(--engage);}
  .core-modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .core-modal-bg.open{display:flex;}
  .core-modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    width:min(420px,90vw);
  }
  .core-modal h3{margin:0 0 6px 0;font-size:15px;}
  .core-modal p{margin:0 0 12px 0;font-size:12.5px;color:var(--sub);line-height:1.5;}
  .core-modal input{
    width:100%;background:var(--card);border:1px solid var(--line);
    color:var(--ink);padding:9px 10px;border-radius:7px;font-size:13px;
    font-family:'Courier New',monospace;margin-bottom:10px;
  }
  .core-modal-actions{display:flex;gap:8px;justify-content:flex-end;}
  .core-modal-actions button{
    border:none;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;
  }
  .core-modal-cancel{background:var(--card);color:var(--ink);border:1px solid var(--line) !important;}
  .core-modal-confirm{background:var(--organize);color:#1b1400;font-weight:600;}
  @media (max-width:820px){
    .core-board{grid-template-columns:1fr 1fr;}
    .core-header{flex-direction:column;}
    .core-sync{text-align:left;}
    .core-sync-row{justify-content:flex-start;}
  }
  @media (max-width:520px){
    .core-board{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="core-app">
  <div class="core-header">
    <div>
      <p class="core-title">C.<span>O</span>.R.E</p>
      <div class="core-sub">CAPTURE &rarr; ORGANIZE &rarr; REVIEW &rarr; ENGAGE</div>
    </div>
    <div class="core-sync">
      <div id="core-status">loading...</div>
      <div class="core-sync-row">
        <button id="core-copy-link">Copy sync link</button>
        <button id="core-use-code">Use another code</button>
      </div>
    </div>
  </div>

  <div class="core-add">
    <input type="text" id="core-input" placeholder="Capture something... (idea, task, note) — press Enter" />
    <button id="core-add-btn">+ Capture</button>
  </div>

  <div class="core-board">
    <div class="core-col" data-stage="capture">
      <div class="core-col-head">
        <div class="core-dot"></div>
        <div class="core-col-title">Capture</div>
        <div class="core-col-desc">Stage 1</div>
      </div>
      <div class="core-cards" id="col-capture"></div>
    </div>
    <div class="core-col" data-stage="organize">
      <div class="core-col-head">
        <div class="core-dot"></div>
        <div class="core-col-title">Organize</div>
        <div class="core-col-desc">Stage 2</div>
      </div>
      <div class="core-cards" id="col-organize"></div>
    </div>
    <div class="core-col" data-stage="review">
      <div class="core-col-head">
        <div class="core-dot"></div>
        <div class="core-col-title">Review</div>
        <div class="core-col-desc">Stage 3</div>
      </div>
      <div class="core-cards" id="col-review"></div>
    </div>
    <div class="core-col" data-stage="engage">
      <div class="core-col-head">
        <div class="core-dot"></div>
        <div class="core-col-title">Engage</div>
        <div class="core-col-desc">Stage 4</div>
      </div>
      <div class="core-cards" id="col-engage"></div>
    </div>
  </div>
</div>

<div class="core-modal-bg" id="core-modal-bg">
  <div class="core-modal">
    <h3>Enter Sync Code</h3>
    <p>Type the sync code from another device to pull the same data here. Get the code by clicking "Copy sync link" on the original device.</p>
    <input type="text" id="core-code-input" placeholder="e.g. 3f9a2b1c-..." />
    <div class="core-modal-actions">
      <button class="core-modal-cancel" id="core-code-cancel">Cancel</button>
      <button class="core-modal-confirm" id="core-code-confirm">Connect</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STAGES = ["capture","organize","review","engage"];
  const NEXT = {capture:"organize", organize:"review", review:"engage"};
  const API = "https://jsonblob.com/api/jsonBlob";
  const LS_ID_KEY = "core-board-id";
  const LS_DATA_KEY = "core-board-data";

  let items = [];
  let boardId = null;
  let saveTimer = null;

  const statusEl = document.getElementById("core-status");
  const inputEl = document.getElementById("core-input");
  const addBtn = document.getElementById("core-add-btn");
  const copyBtn = document.getElementById("core-copy-link");
  const useCodeBtn = document.getElementById("core-use-code");
  const modalBg = document.getElementById("core-modal-bg");
  const codeInput = document.getElementById("core-code-input");
  const codeCancel = document.getElementById("core-code-cancel");
  const codeConfirm = document.getElementById("core-code-confirm");

  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('en-MY',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'});
  }
  function uid(){
    return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function newBoardId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
  }

  function getIdFromUrl(){
    const params = new URLSearchParams(window.location.hash.replace('#',''));
    return params.get('id');
  }
  function setIdInUrl(id){
    window.location.hash = 'id=' + id;
  }

  async function createRemoteBoard(id, data){
    // jsonblob lets us PUT to create at a specific location if we first POST once globally;
    // to keep a stable, human-shareable id we store OUR id as a field inside the blob itself
    // and use jsonblob's generated blob id as the actual remote key, mapped via localStorage.
    const res = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({coreId: id, items: data})
    });
    const loc = res.headers.get('Location');
    if(!loc) throw new Error('no location header');
    const remoteId = loc.split('/').pop();
    return remoteId;
  }

  async function fetchRemote(remoteId){
    const res = await fetch(API + '/' + remoteId, {headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('fetch failed');
    return await res.json();
  }

  async function putRemote(remoteId, data){
    const res = await fetch(API + '/' + remoteId, {
      method:'PUT',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({coreId: boardId, items: data})
    });
    return res.ok;
  }

  function saveLocal(){
    try{
      localStorage.setItem(LS_DATA_KEY, JSON.stringify(items));
      localStorage.setItem(LS_ID_KEY, boardId);
      if(remoteId) localStorage.setItem('core-remote-' + boardId, remoteId);
    }catch(e){}
  }

  let remoteId = null;

  async function resolveRemoteId(id){
    const cached = localStorage.getItem('core-remote-' + id);
    if(cached) return cached;
    return null;
  }

  async function init(){
    statusEl.textContent = "loading...";
    let id = getIdFromUrl();
    if(!id) id = localStorage.getItem(LS_ID_KEY);
    if(!id) id = newBoardId();
    boardId = id;
    setIdInUrl(boardId);

    remoteId = await resolveRemoteId(boardId);

    if(remoteId){
      try{
        const remote = await fetchRemote(remoteId);
        items = remote.items || [];
        saveLocal();
        statusEl.textContent = "synced";
      }catch(e){
        const local = localStorage.getItem(LS_DATA_KEY);
        items = local ? JSON.parse(local) : [];
        statusEl.textContent = "using local data (sync failed)";
      }
    } else {
      const local = localStorage.getItem(LS_DATA_KEY);
      items = local ? JSON.parse(local) : [];
      try{
        remoteId = await createRemoteBoard(boardId, items);
        saveLocal();
        statusEl.textContent = "synced";
      }catch(e){
        statusEl.textContent = "offline (local only)";
      }
    }
    render();
  }

  function scheduleSave(){
    statusEl.textContent = "saving...";
    saveLocal();
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 400);
  }

  async function doSave(){
    saveLocal();
    if(!remoteId){
      try{
        remoteId = await createRemoteBoard(boardId, items);
        saveLocal();
        statusEl.textContent = "synced";
      }catch(e){
        statusEl.textContent = "saved locally (sync failed)";
      }
      return;
    }
    try{
      const ok = await putRemote(remoteId, items);
      statusEl.textContent = ok ? "synced" : "saved locally (sync failed)";
    }catch(e){
      statusEl.textContent = "saved locally (sync failed)";
    }
  }

  function addItem(text){
    text = text.trim();
    if(!text) return;
    items.unshift({id: uid(), text: text, stage: "capture", ts: Date.now()});
    render();
    scheduleSave();
  }
  function advance(id){
    const item = items.find(i => i.id === id);
    if(!item) return;
    const next = NEXT[item.stage];
    if(next){
      item.stage = next;
      item.ts = Date.now();
      render();
      scheduleSave();
    }
  }
  function removeItem(id){
    items = items.filter(i => i.id !== id);
    render();
    scheduleSave();
  }
  function hintFor(stage){
    if(stage === "engage") return "click = done & remove";
    return "click to advance";
  }

  function render(){
    STAGES.forEach(stage => {
      const col = document.getElementById("col-" + stage);
      const list = items.filter(i => i.stage === stage);
      col.innerHTML = "";
      if(list.length === 0){
        const empty = document.createElement("div");
        empty.className = "core-empty";
        empty.textContent = stage === "capture" ? "Nothing yet. Capture your first idea." : "Empty.";
        col.appendChild(empty);
        return;
      }
      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "core-card";
        card.setAttribute("data-stage", item.stage);

        const del = document.createElement("button");
        del.className = "core-del";
        del.textContent = "\u2715";
        del.title = "Remove";
        del.onclick = (e) => { e.stopPropagation(); removeItem(item.id); };
        card.appendChild(del);

        const text = document.createElement("div");
        text.className = "core-card-text";
        text.textContent = item.text;
        card.appendChild(text);

        const meta = document.createElement("div");
        meta.className = "core-card-meta";
        const time = document.createElement("span");
        time.className = "core-card-time";
        time.textContent = fmtTime(item.ts);
        const hint = document.createElement("span");
        hint.className = "core-card-hint";
        hint.textContent = hintFor(item.stage);
        meta.appendChild(time);
        meta.appendChild(hint);
        card.appendChild(meta);

        card.onclick = () => {
          if(item.stage === "engage") removeItem(item.id);
          else advance(item.id);
        };
        col.appendChild(card);
      });
    });
  }

  addBtn.onclick = () => { addItem(inputEl.value); inputEl.value = ""; inputEl.focus(); };
  inputEl.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ addItem(inputEl.value); inputEl.value = ""; }
  });

  copyBtn.onclick = async () => {
    const url = window.location.href;
    try{
      await navigator.clipboard.writeText(url);
      copyBtn.textContent = "Copied!";
    }catch(e){
      copyBtn.textContent = url;
    }
    setTimeout(() => { copyBtn.textContent = "Copy sync link"; }, 1800);
  };

  useCodeBtn.onclick = () => { modalBg.classList.add('open'); codeInput.value=''; codeInput.focus(); };
  codeCancel.onclick = () => modalBg.classList.remove('open');
  codeConfirm.onclick = () => {
    const val = codeInput.value.trim();
    if(!val) return;
    window.location.hash = 'id=' + val;
    window.location.reload();
  };

  init();
})();
</script>
</body>
</html>
